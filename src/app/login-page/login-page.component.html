<div class="fixed top-0 z-[-2] h-screen w-screen bg-gradient-to-br from-accent to-secondary"></div>
<div
  class="flex justify-center transition-transform transition-discrete md:fixed md:top-0 md:h-screen md:w-screen md:items-center"
>
  <div class="z-10 flex w-full max-w-[768px] flex-col gap-2 rounded-md bg-background p-4 text-text">
    <div
      class="flex w-full flex-row items-center gap-2 rounded-md bg-card p-4 focus-within:border-1 focus-within:border-primary"
    >
      <svg class="size-7 fill-text">
        <use xlink:href="assets/g-icons.svg#icon-email"></use>
      </svg>
      <div class="w-full p-2">
        <input
          type="email"
          class="w-full outline-none placeholder:text-secondary-text"
          placeholder="Introduzca su email"
        />
      </div>
    </div>
    <div
      class="flex w-full flex-row items-center gap-2 rounded-md bg-card p-4 focus-within:border-1 focus-within:border-primary"
    >
      <svg class="size-7 fill-text">
        <use xlink:href="assets/g-icons.svg#icon-lock_outline"></use>
      </svg>
      <div class="w-full p-2">
        <input
          type="password"
          placeholder="Introduzca su contraseña"
          class="outline-none placeholder:text-secondary-text"
        />
      </div>
    </div>

    <div class="ri w-full rounded-md bg-card p-2 text-right">
      <span>
        <a href="" class="text-text underline hover:text-primary">¿Has olvidado tu contraseña?</a>
      </span>
    </div>

    <div class="w-full items-center rounded-md bg-primary p-2">
      <div class="w-full cursor-pointer items-center rounded-md bg-primary p-3 text-center text-xl text-white">
        <input type="button" value="Iniciar Sesión" class="cursor-pointer" />
      </div>
    </div>

    <div class="w-full rounded-md bg-background p-2 text-center">
      <span>
        <span class="select-none"> ¿No tienes cuenta? </span>
        <a routerLink="/signup" class="text-secondary-text underline hover:text-primary">Regístrate</a>
      </span>
    </div>
  </div>
</div>
