<div
  class="z-1 flex h-14 items-center p-4"
  [ngClass]="{
    'bg-card': !topBarConf.transparent,
    'bg-transparent': topBarConf.transparent,
  }"
>
  @if (topBarConf.leftButtons.length !== 0 || topBarConf.centerTitle) {
    <div class="z-1 flex w-50 items-center justify-start gap-4">
      @for (button of topBarConf.leftButtons; track $index) {
        <svg
          class="z-1 size-8 cursor-pointer rounded-md fill-text p-1 hover:bg-background active:bg-background"
          (click)="onButtonClick(button)"
          (keydown)="onButtonClick(button)"
        >
          <use [attr.xlink:href]="iconsFile + button.icon"></use>
        </svg>
      }
    </div>
  }

  <h1
    class="z-1 w-full text-center text-xl font-bold text-text select-none"
    [class.text-center]="topBarConf.centerTitle"
  >
    {{ topBarConf.title }}
  </h1>

  <div class="z-1 flex w-50 items-center justify-end gap-4">
    @for (button of topBarConf.rightButtons; track $index) {
      <svg
        class="z-1 size-8 cursor-pointer rounded-md fill-text p-1 hover:bg-background active:bg-background"
        (click)="onButtonClick(button)"
        (keydown)="onButtonClick(button)"
      >
        <use [attr.xlink:href]="iconsFile + button.icon"></use>
      </svg>
    }
  </div>
</div>
