<div class="z-1 flex h-14 items-center bg-amber-100 p-4">
  @if (topBarConf.leftButtons.length !== 0 || topBarConf.centerTitle) {
    <div class="z-1 flex w-50 items-center justify-start gap-4">
      @for (button of topBarConf.leftButtons; track $index) {
        <svg routerLink="/" class="z-1 size-6" (click)="onButtonClick(button)" (keydown)="onButtonClick(button)">
          <use [attr.xlink:href]="button.type"></use>
        </svg>
      }
    </div>
  }

  <h1 class="z-1 w-full text-center text-xl font-bold" [class.text-center]="topBarConf.centerTitle">
    {{ topBarConf.title }}
  </h1>

  <div class="z-1 flex w-50 items-center justify-end gap-4">
    @for (button of topBarConf.rightButtons; track $index) {
      <svg routerLink="/" class="size-6" (click)="onButtonClick(button)" (keydown)="onButtonClick(button)">
        <use [attr.xlink:href]="button.type"></use>
      </svg>
    }
  </div>
</div>
