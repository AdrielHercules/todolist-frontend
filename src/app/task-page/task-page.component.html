<section class="flex h-full flex-col gap-2 bg-gray-200 p-2">
  @for (task of pendingTasks(); track task.id) {
    <app-task-item
      [task]="task"
      (taskChanged)="updateTask($event)"
      (longPress)="onLongPress(task)"
      (shortPress)="onShortPress(task)"
      [isSelected]="isSelected(task)"
    >
    </app-task-item>
  }

  @if (completedTasks().length !== 0) {
    <h2 class="p-2 text-sm text-gray-800">COMPLETADAS</h2>
  }

  @for (task of completedTasks(); track task.id) {
    <app-task-item
      [task]="task"
      (taskChanged)="updateTask($event)"
      (longPress)="onLongPress(task)"
      (shortPress)="onShortPress(task)"
      [isSelected]="isSelected(task)"
    >
    </app-task-item>
  }

  <div class="fixed right-10 bottom-10">
    <app-add-button (click)="onAddTask()"></app-add-button>
  </div>
</section>
