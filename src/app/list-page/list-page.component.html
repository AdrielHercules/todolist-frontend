<section class="flex flex-col gap-2 p-2">
  @for (list of lists; track $index) {
    <app-list-item (click)="onListClick(list.id)" [list]="list"></app-list-item>
  }

  <div class="fixed right-10 bottom-10">
    <app-add-list-button (click)="onAddListClick()"></app-add-list-button>
  </div>
</section>
