<section class="flex flex-col gap-2 p-2">
  @for (list of lists; track $index) {
    <app-list-item
      appLongPress
      [duration]="250"
      (longPress)="toggleList(list.id)"
      (shortPress)="onListClick(list.id)"
      [list]="list"
      [isSelected]="selectedLists.has(list.id)"
    ></app-list-item>
  }

  <div class="fixed right-10 bottom-10">
    <app-add-button (click)="onAddListClick()"></app-add-button>
  </div>
</section>
