<div
  class="h-15 content-center rounded-md select-none hover:cursor-pointer hover:bg-gray-100"
  [ngClass]="{
    'bg-white': !isSelected(),
    'bg-gray-100': isSelected(),
    'border-1': isSelected(),
    'border-black': isSelected(),
  }"
>
  <div class="flex gap-2 pr-5 pl-5">
    <p>{{ list()?.icon }}</p>
    <p>{{ list()?.name }}</p>
  </div>
</div>
