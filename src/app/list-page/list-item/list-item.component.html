<div
  class="h-15 content-center rounded-md select-none hover:cursor-pointer hover:bg-accent"
  [ngClass]="{
    'bg-secondary': !isSelected(),
    'bg-accent': isSelected(),
    'border-1': isSelected(),
    'border-primary': isSelected(),
  }"
>
  <div class="flex gap-2 pr-5 pl-5 text-text">
    <p>{{ list()?.icon }}</p>
    <p>{{ list()?.name }}</p>
  </div>
</div>
